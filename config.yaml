github:
  owner: mysterymanjbnb-alt
  repo: daily-paper-reader
arxiv_paper_setting:
  mode: standard
  days_window: 9
  docs_dir: docs
  prefer_supabase_read: true
supabase:
  enabled: true
  url: https://lyucdwgefyfbmaiopjbk.supabase.co
  anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
  papers_table: arxiv_papers
  use_vector_rpc: true
  vector_rpc: match_arxiv_papers
  vector_rpc_ann: match_arxiv_papers
  vector_rpc_exact: match_arxiv_papers_exact
  use_bm25_rpc: true
  bm25_rpc: match_arxiv_papers_bm25
  sync_table: arxiv_sync_status
  sync_success_value: success
  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: ai-security
      description: Artificial intelligence security, robustness, privacy, alignment, adversarial attacks and defenses.
      enabled: true
      paper_sources: [arxiv, openreview]
      keywords:
        - adversarial machine learning
        - AI security
        - model robustness
        - AI alignment
        - privacy-preserving machine learning
        - backdoor attack
        - adversarial defense
        - model safety
      intent_queries:
        - Research on AI security including adversarial attacks, backdoor attacks, robustness, privacy, alignment, safety evaluation, and practical defenses for machine learning systems.
        - New methods for detecting, mitigating, and evaluating security vulnerabilities in deep learning and AI systems.
    - tag: federated-learning
      description: Federated learning systems, security, privacy and personalized collaboration.
      enabled: true
      paper_sources: [arxiv, openreview]
      keywords:
        - federated learning
        - federated learning security
        - federated backdoor
        - Byzantine-robust federated learning
        - secure aggregation
        - federated unlearning
        - personalized federated learning
      intent_queries:
        - Secure and robust federated learning, with a focus on backdoor defenses, poisoning attacks, Byzantine robustness, privacy preservation, secure aggregation, and trustworthy aggregation.
        - Federated learning techniques for heterogeneous clients, personalization, efficient collaboration, and reliable real-world deployment.
    - tag: ai-agents
      description: LLM agents, multi-agent systems, agent security and tool use.
      enabled: true
      paper_sources: [arxiv, openreview]
      keywords:
        - LLM agent
        - AI agent
        - multi-agent system
        - agent security
        - tool-using agents
        - agentic workflow
        - multi-agent collaboration
        - prompt injection
      intent_queries:
        - LLM agent and multi-agent research covering planning, memory, tool use, evaluation, reliability, agent safety, prompt injection, and secure autonomous systems.
        - Agentic systems for complex tasks, including collaboration, self-improvement, long-horizon reasoning, and trustworthy tool execution.
    - tag: large-language-models
      description: Large language models, reasoning, safety, security and efficient adaptation.
      enabled: true
      paper_sources: [arxiv, openreview]
      keywords:
        - large language model
        - LLM reasoning
        - LLM safety
        - LLM security
        - jailbreak
        - prompt injection
        - retrieval augmented generation
        - LLM fine-tuning
      intent_queries:
        - Advances in large language models including reasoning, post-training, efficient fine-tuning, retrieval augmented generation, multimodality, evaluation, and deployment.
        - Security and safety of large language models, including jailbreaks, prompt injection, data leakage, red teaming, hallucination mitigation, and alignment.
    - tag: embodied-ai-security
      description: Embodied AI and robotics security, safety, robustness, and trustworthy human-robot interaction.
      enabled: true
      paper_sources: [arxiv, openreview]
      keywords:
        - embodied AI
        - embodied intelligence
        - robot learning
        - robot security
        - robot safety
        - autonomous robot
        - vision-language-action model
        - physical adversarial attack
      intent_queries:
        - Security, safety, robustness, and privacy of embodied AI, robot learning, autonomous robots, and vision-language-action models operating in the physical world.
        - Attacks and defenses for robotic and embodied systems, including physical adversarial attacks, sensor spoofing, safe control, human-robot interaction, and trustworthy deployment.
